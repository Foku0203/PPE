name: ppe_mobile_app
description: "PPE Management mobile app (Flutter) for workers, supervisors, store keepers, EHS and admins."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management & routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  # Networking
  dio: ^5.11.1
  uuid: ^4.6.0
  # Storage (tokens in secure storage, cache/drafts/offline queue in Hive)
  flutter_secure_storage: ^11.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # i18n
  intl: ^0.20.3
  # Media, QR & security
  cached_network_image: ^4.0.2
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  local_auth: ^3.0.2
  # Push notifications (needs google-services.json / GoogleService-Info.plist, see README)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/ppe/
    - assets/images/banners/
